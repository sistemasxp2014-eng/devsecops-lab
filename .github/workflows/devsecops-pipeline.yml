name: Pipeline DevSecOps End-to-End 
on: 
push: 
branches: [ "main" ] 
pull_request: 
branches: [ "main" ] 
permissions: 
contents: read 
packages: write 
  id-token: write 
 
jobs: 
  secret-scanning: 
    name: 1. Secret Scanning (Gitleaks) 
    runs-on: ubuntu-latest 
    steps: 
      - uses: actions/checkout@v4 # nosemgrep 
        with: 
          fetch-depth: 0 
      - name: Gitleaks Scan 
        uses: gitleaks/gitleaks-action@v2 # nosemgrep 
 
  sast: 
    name: 2. SAST (Semgrep) 
    needs: secret-scanning 
    runs-on: ubuntu-latest 
    steps: 
      - uses: actions/checkout@v4 # nosemgrep 
      - name: Ejecutar Semgrep 
        run: | 
          docker run --rm -v "${{ github.workspace }}:/src" returntocorp/semgrep semgrep scan --config auto --error 
 
  sca: 
    name: 3. SCA (Trivy Filesystem) 
    needs: secret-scanning 
    runs-on: ubuntu-latest 
    steps: 
      - uses: actions/checkout@v4 # nosemgrep 
      - name: Escaneo de librerías con Trivy 
        uses: aquasecurity/trivy-action@master # nosemgrep 
        with: 
          scan-type: 'fs' 
          scan-ref: 'app/' 
          severity: 'HIGH,CRITICAL' 
          exit-code: '1' 
 
  iac-security: 
    name: 4. IaC Security (Checkov) 
    needs: secret-scanning 
    runs-on: ubuntu-latest 
    steps: 
      - uses: actions/checkout@v4 # nosemgrep 
      - name: Escaneo de IaC con Checkov 
        uses: bridgecrewio/checkov-action@v12 # nosemgrep 
        with: 
          directory: '.' 
          framework: 'terraform,dockerfile' 
          soft_fail: true 
 
  build-and-sbom: 
    name: 5. Build, Container Scan & SBOM 
    needs: [sast, sca, iac-security] 
    runs-on: ubuntu-latest 
    outputs: 
      image_tag: ${{ steps.meta.outputs.tags }} 
    env: 
      REGISTRY: ghcr.io 
      IMAGE_NAME: ${{ github.repository }} 
    steps: 
      - uses: actions/checkout@v4 # nosemgrep 
 
      - name: Iniciar sesión en GitHub Container Registry 
        uses: docker/login-action@v3 # nosemgrep 
        with: 
          registry: ${{ env.REGISTRY }} 
          username: ${{ github.actor }} 
          password: ${{ secrets.GITHUB_TOKEN }} 
 
      - name: Extraer metadatos de la imagen 
        id: meta 
        uses: docker/metadata-action@v5 # nosemgrep 
        with: 
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }} 
          tags: | 
            type=sha,format=long 
 
      - name: Compilar Imagen Docker Local 
        uses: docker/build-push-action@v5 # nosemgrep 
        with: 
          context: . 
          load: true 
          tags: ${{ steps.meta.outputs.tags }} 
 
      - name: Generar SBOM con Syft 
        uses: anchore/sbom-action@v0 # nosemgrep 
        with: 
          image: ${{ steps.meta.outputs.tags }} 
          format: cyclonedx-json 
          output-file: 'sbom.cyclonedx.json' 
 
      - name: Publicar SBOM como Artefacto 
        uses: actions/upload-artifact@v4 # nosemgrep 
        with: 
          name: sbom-cyclonedx 
          path: sbom.cyclonedx.json 
 
      - name: Escaneo de Imagen Docker con Trivy 
        uses: aquasecurity/trivy-action@master # nosemgrep 
        with: 
          image-ref: ${{ steps.meta.outputs.tags }} 
          severity: 'CRITICAL' 
          ignore-unfixed: true 
          exit-code: '0' 
 
      - name: Publicar Imagen en GHCR 
        uses: docker/build-push-action@v5 # nosemgrep 
        with: 
          context: . 
          push: true 
          tags: ${{ steps.meta.outputs.tags }} 
 
  sign-container: 
    name: 6. Firma de Artefacto (Cosign Keyless) 
    needs: build-and-sbom 
    runs-on: ubuntu-latest 
    steps: 
      - name: Instalar Cosign 
        uses: sigstore/cosign-installer@v3.5.0 # nosemgrep 
 
      - name: Iniciar sesión en GHCR 
        uses: docker/login-action@v3 # nosemgrep 
        with: 
          registry: ghcr.io 
          username: ${{ github.actor }} 
          password: ${{ secrets.GITHUB_TOKEN }} 
 
      - name: Firmar Imagen mediante Sigstore (OIDC Keyless) 
        run: | 
          RAW_IMAGE="${{ needs.build-and-sbom.outputs.image_tag }}" 
          IMAGE_REF=$(echo "$RAW_IMAGE" | tr '[:upper:]' '[:lower:]') 
          echo "Firmando la imagen: $IMAGE_REF" 
          cosign sign --yes "$IMAGE_REF" 
